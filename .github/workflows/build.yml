name: Build Plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.0'
          arch: 'win64_mingw'

      - name: Download SDK
        run: |
          curl -L -o sdk.zip https://github.com/InsightDAQ/InsightDAQ/releases/download/sdk-v1.0.0/daq-plugin-sdk-v1.0.0.zip
          Expand-Archive sdk.zip -DestinationPath sdk

      - name: Configure
        run: cmake -B build -DDAQ_SDK_DIR=${{ github.workspace }}/sdk

      - name: Build
        run: cmake --build build --config Release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-windows
          path: |
            build/Release/*.dll
            node.json

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.0'

      - name: Download SDK
        run: |
          curl -L -o sdk.tar.gz https://github.com/InsightDAQ/InsightDAQ/releases/download/sdk-v1.0.0/daq-plugin-sdk-v1.0.0-linux.tar.gz
          tar xzf sdk.tar.gz -C sdk

      - name: Configure
        run: cmake -B build -DDAQ_SDK_DIR=${{ github.workspace }}/sdk

      - name: Build
        run: cmake --build build --config Release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-linux
          path: |
            build/*.so
            node.json
